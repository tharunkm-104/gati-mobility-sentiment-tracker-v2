# .github/workflows/google_alerts_ingest.yml
#
# Fully isolated from .github/workflows/daily-update.yml. This workflow
# only ever touches:
#   - scripts/google_alerts_ingest.py
#   - data/google_alerts_items.csv
# It never runs fetch_and_process.py and never writes data/items.csv.

name: Google Alerts Ingest (Gemini tagging)

on:
  schedule:
    # Offset from your existing daily-update.yml schedule so you can tell
    # the two pipelines' commits apart in the repo history. Adjust the
    # hour to whenever your Alerts feeds tend to have settled for the day
    # (UTC time — e.g. 5:30 AM UTC = 11:00 AM IST).
    - cron: "30 5 * * *"
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write   # needed to commit the updated CSV back to the repo

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements-alerts.txt

      - name: Run Google Alerts ingest + Gemini tagging
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # ALERTS_CSV_PATH defaults to data/google_alerts_items.csv inside
          # the script itself — only set this secret/var if you want to
          # override that default.
        run: |
          python scripts/google_alerts_ingest.py

      - name: Commit updated CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/google_alerts_items.csv
          git diff --cached --quiet || git commit -m "Google Alerts ingest: $(date -u +'%Y-%m-%d')"
          git push
